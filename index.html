<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alterity – Trigger Outbound Call</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* ── Card ── */
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
      width: 100%;
      max-width: 660px;
      padding: 20px 20px 24px;
    }

    @media (min-width: 480px) {
      .card { padding: 28px 32px 32px; }
    }

    /* ── Banner ── */
    .banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fefce8;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 28px;
    }

    .banner svg {
      flex-shrink: 0;
      color: #d97706;
    }

    .banner-text {
      font-size: 13.5px;
      color: #92400e;
      font-weight: 500;
      line-height: 1.4;
    }

    /* ── Form fields ── */
    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13.5px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="tel"] {
      width: 100%;
      height: 46px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      padding: 0 12px;
      font-size: 16px; /* 16px prevents iOS zoom on focus */
      color: #111827;
      background: #fff;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    @media (min-width: 480px) {
      input[type="text"],
      input[type="tel"] { height: 42px; font-size: 14px; }
    }

    input[type="text"]::placeholder,
    input[type="tel"]::placeholder {
      color: #9ca3af;
    }

    input[type="text"]:focus,
    input[type="tel"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.12);
    }

    /* ── Phone row ── */
    .phone-row {
      display: flex;
      gap: 0;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }

    .phone-row:focus-within {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.12);
    }

    .country-selector {
      display: flex;
      align-items: center;
      padding: 0 10px 0 12px;
      background: #f9fafb;
      border-right: 1px solid #d1d5db;
      flex-shrink: 0;
    }

    .country-flag {
      font-size: 20px;
      line-height: 1;
    }

    .phone-row input[type="tel"] {
      border: none;
      border-radius: 0;
      flex: 1;
      height: 46px;
      box-shadow: none;
    }

    @media (min-width: 480px) {
      .phone-row input[type="tel"] { height: 42px; }
    }

    .phone-row input[type="tel"]:focus {
      box-shadow: none;
    }

    /* ── Button ── */
    .trigger-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 50px;
      margin-top: 24px;
      border: none;
      border-radius: 8px;
      background: #6b7280;
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, opacity .15s;
      letter-spacing: .01em;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    @media (min-width: 480px) {
      .trigger-btn { height: 46px; font-size: 15px; margin-top: 28px; }
    }

    .trigger-btn:hover:not(:disabled) {
      background: #4b5563;
    }

    .trigger-btn:active:not(:disabled) {
      background: #374151;
    }

    .trigger-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    /* spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    .trigger-btn.loading .spinner {
      display: block;
    }

    .trigger-btn.loading .btn-label {
      opacity: .8;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Toast ── */
    .toast-wrap {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 999;
    }

    @media (min-width: 480px) {
      .toast-wrap { left: auto; right: 28px; bottom: 28px; width: 320px; }
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111827;
      color: #fff;
      font-size: 13.5px;
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      animation: slideUp .22s ease;
    }

    .toast.success { background: #059669; }
    .toast.error   { background: #dc2626; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Banner -->
  <div class="banner">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span class="banner-text">Calls can only be triggered from 9 AM to 9 PM IST</span>
  </div>

  <!-- Candidate name -->
  <div class="field">
    <label for="candidate-name">Candidate name</label>
    <input type="text" id="candidate-name" placeholder="Enter candidate name" autocomplete="name" />
  </div>

  <!-- Phone -->
  <div class="field">
    <label>Phone number</label>
    <div class="phone-row">

      <div class="country-selector">
        <span class="country-flag" id="selFlag">🇮🇳</span>
      </div>

      <input type="tel" id="phone-number" placeholder="Enter phone number" autocomplete="tel-national" />
    </div>
  </div>

  <!-- Button -->
  <button class="trigger-btn" id="triggerBtn" type="button">
    <div class="spinner"></div>
    <span class="btn-label">Trigger call</span>
  </button>

</div>

<!-- Toast container -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
  /* ── Config ── */
  const EDGE_FUNCTION_URL = "https://fmkqadjrfheoptcwqdqo.supabase.co/functions/v1/trigger-call";

  /* ── Toast helper ── */
  function showToast(msg, type = "") {
    const wrap = document.getElementById("toastWrap");
    const t = document.createElement("div");
    t.className = "toast " + type;
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  /* ── Trigger call ── */
  const btn = document.getElementById("triggerBtn");

  btn.addEventListener("click", async () => {
    const candidateName = document.getElementById("candidate-name").value.trim();
    const phone         = document.getElementById("phone-number").value.trim();

    if (!candidateName) { showToast("Please enter a candidate name.", "error"); return; }
    if (!phone)         { showToast("Please enter a phone number.", "error");   return; }

    const fullPhone = "+91" + phone.replace(/\D/g, "");

    btn.disabled = true;
    btn.classList.add("loading");

    try {
      const res = await fetch(EDGE_FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ candidateName, phone: fullPhone }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }

      showToast("Call triggered successfully!", "success");
      document.getElementById("candidate-name").value  = "";
      document.getElementById("phone-number").value    = "";
    } catch (err) {
      showToast(`Failed to trigger call: ${err.message}`, "error");
    } finally {
      btn.disabled = false;
      btn.classList.remove("loading");
    }
  });
</script>
</body>
</html>
